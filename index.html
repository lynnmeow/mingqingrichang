  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  /* 宣纸：暖米渐变 + 极淡纸纹（多层 radial 噪点），去原深黑底 */
  background:
    radial-gradient(140px 140px at 18% 12%, rgba(120,100,70,0.05), transparent 60%),
    radial-gradient(180px 180px at 82% 30%, rgba(120,100,70,0.04), transparent 60%),
    radial-gradient(160px 160px at 30% 88%, rgba(120,100,70,0.05), transparent 60%),
    linear-gradient(160deg, #f3ead9 0%, #ece0c8 55%, #e4d6ba 100%);
  color: #3a3027;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: none;
}

/* 布局：竖向流式。
   · PC：画布 height:100% 上下拉满（居中，宽度随竖屏比例自适应）。
   · 移动端：以 750×1334 为设计基准，主内容区宽度封顶 750 居中；触控控件改为绝对叠层于地图（非独立底部操作区）。 */
#stage {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
}

/* 游戏视口：占满剩余空间（上下拉满）；canvas 由 JS 取最大可容尺寸。
   画卷装裱感：浅纸内衬 + 柔和内阴影 + 细墨线外晕，圆角减小近方形更似卷轴。 */
#frame {
  position: relative;
  z-index: 1;                 /* 抬升游戏画布层级：使底部说明 #decl(z-index:0) 永在其下，不遮挡底部栏（2026-07-25 修） */
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  width: 100%;
  max-width: 750px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0.08));
  box-shadow: inset 0 0 22px rgba(120,100,70,0.10);
}

/* 竖屏画布：尺寸由 JS（resize）写入 style.width/height；后备分辨率=显示尺寸×dpr，
   故用平滑渲染（image-rendering:auto），文字与图形在设备像素级栅格化→清晰不糊。
   边框由粗棕改为细墨线 + 柔光外晕。 */
#game {
  display: block;
  image-rendering: auto;
  background: #efe3cf;
  border: 1.5px solid rgba(58,48,39,0.55);
  border-radius: 8px;
  box-shadow: 0 10px 34px rgba(90,70,40,0.18), 0 0 0 4px rgba(255,255,255,0.35), inset 0 0 0 1px rgba(255,255,255,0.25);
  touch-action: none;
}

/* 触控操作区：仅触屏显示。桌面端隐藏。 */
#controls {
  display: none;
  flex: 0 0 auto;
  width: 100%;
  max-width: 750px;
  margin: 0 auto;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 18px calc(12px + env(safe-area-inset-bottom, 0px));
}

/* 移动端叠层+半透明白玻璃样式已移至文件末尾。
   关键：@media 块必须位于基础 #btns/.act 规则【之后】，
   否则会被同特异性、后定义的基础规则覆盖——表现为按钮错位到页面顶部、非玻璃半透明。（2026-07-21 修） */

/* 触控操作按钮容器（摇杆已移除，改为画布自由滑动/点击移动） */
#btns {
  display: grid;
  grid-template-columns: repeat(2, 64px);
  grid-gap: 12px;
}
/* 水墨圆按钮：刷感渐变 + 墨色字 + 图标 + 文字，提升可读性 */
.act {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 2px solid rgba(58,48,39,0.55);
  background: linear-gradient(180deg, rgba(247,239,225,0.96), rgba(222,208,182,0.96));
  color: #3a3027;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  line-height: 1.1;
  touch-action: none;
  box-shadow: 0 3px 10px rgba(90,70,40,0.22), inset 0 1px 0 rgba(255,255,255,0.5);
  transition: transform 0.05s ease, background 0.1s ease;
}
.act .ico { font-size: 16px; line-height: 1; }
.act:active {
  transform: scale(0.94);
  background: linear-gradient(180deg, #e8c06a, #d9a94a);
  color: #2a2218;
}
/* 合击键：朱砂淡彩，点睛 */
.act.combo {
  border-color: rgba(194,69,61,0.7);
  background: linear-gradient(180deg, rgba(232,168,168,0.96), rgba(200,99,90,0.96));
  color: #fff;
}
.act.combo:active { background: linear-gradient(180deg, #c2453d, #a8352e); color: #fff; }

/* 底部说明（同人免责 + 落款）。显隐规则由 body 的 on-title / in-game / slot-open 类驱动：
   · 开始界面（body.on-title，且非选档）：PC 与移动端【都显示】，落于开始界面底部；
   · 选档界面（body.slot-open，即打开存档的选档子界面）：【隐藏】，避免遮挡底部「‹ 返回」按钮；
   · 游戏内（body.in-game）：【仅移动端显示】，落于游戏下方，PC 不显示。
   采用绝对叠层（脱离 flex 流 → 不占空间，游戏本体始终获得完整高度，优先保证游戏完整显示）；
   半透、pointer-events:none 不拦截操作；细字落于画布最底缘，可被游戏画面覆盖/让位。 */
#decl {
  display: none;
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 0;                 /* 置于游戏画布(#frame z-index:1)之下：即使显示也不遮挡底部栏（2026-07-25 修） */
  text-align: center;
  padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px));
  font-size: 10.5px;
  line-height: 1.5;
  color: rgba(124,98,78,0.78);
  background: linear-gradient(180deg, rgba(236,224,200,0) 0%, rgba(236,224,200,0.5) 100%);
  pointer-events: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#decl .by { color: rgba(194,69,61,0.65); margin-bottom: 1px; }
/* 开始界面（非选档时）：PC + 移动端都显示；选档（打开存档）界面由 slot-open 排除，避免挡「‹ 返回」按钮 */
body.on-title:not(.slot-open) #decl { display: block; z-index: 2; }  /* 开始界面落款仍显示在画布之上 */

/* ============================================================
   移动端叠层 + 半透明白玻璃（必须位于基础 #btns/.act 之后）。
   取消独立底部操作区：控件绝对叠在地图上、pointer-events 仅控件自身可点，
   让地图点击/拖拽穿透；#frame 不再被底部行挤占，地图纵向铺满更多。
   按钮半透明白玻璃（2026-07-21 修：原黑灰 + 错位顶部）。
   ============================================================ */
@media (hover: none) and (pointer: coarse) {
  /* 移动端：contain(不裁切/不放大)，游戏置顶、空隙集中在底部；背景用与页面一致的宣纸色，不留渐变"空段" */
  #frame {
    align-items: center;        /* 纵向居中：设备高于游戏比例时画布上下自然留白（小红书导航栏等落在顶部留白，不遮游戏） */
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 0 0;   /* 仅标准刘海/状态栏安全区，不再硬编码导航栏预留 */
    border-radius: 0;
    overflow: hidden;
    background: #ece0c8;
    box-shadow: none;
    position: relative;
  }
  /* 游戏内：#frame 背景转透明，使位于画布之下、bottom:0 的 #decl(z-index:0) 在画布下方空余区可见；
     声明始终处于游戏本体下层（z-index 低于画布），绝不遮挡游戏（2026-08-04 修） */
  body.in-game #frame { background: transparent; }
  #game {
    border: none;
    border-radius: 0;
    box-shadow: none;
  }
  #controls {
    display: block;
    position: absolute;
    inset: 0;
    z-index: 6;
    width: auto; max-width: none;
    margin: 0; padding: 0;
    pointer-events: none;
  }
  /* 操作按钮：贴地图右下，半透明白玻璃（摇杆已移除） */
  #btns {
    position: absolute;
    right: 16px;
    bottom: calc(108px + env(safe-area-inset-bottom, 0px));
    pointer-events: auto;
    display: none;   /* 家园态隐藏：否则会叠在画布底栏「游历」按钮上方吞点击（2026-07-23 修） */
  }
  /* 仅外出战斗态显示触控操作按钮（家园态不显示，避免遮挡底栏） */
  body.outing-scene #btns { display: grid; }
  .act {
    background: rgba(255,255,255,0.62);
    border: 1.5px solid rgba(255,255,255,0.72);
    box-shadow: 0 3px 12px rgba(90,70,40,0.20), inset 0 1px 0 rgba(255,255,255,0.65);
    color: #3a3027;
  }
  .act.combo {
    background: rgba(194,69,61,0.36);
    border-color: rgba(194,69,61,0.78);
    color: #fff;
  }
  /* 底部说明（游戏内）：仅移动端 + 游戏内（body.in-game）叠层显于画布最底缘；
     PC 端无论何种状态都不显示（基础规则在文件上方，此处不再覆盖显示）。
     脱离布局流 → 游戏优先完整显示；半透、pointer-events:none 不拦截。 */
  body.in-game #decl { display: block; }
}
/* 极窄屏(≤360px)：缩小按钮，避免左右争空间 */
@media (hover: none) and (pointer: coarse) and (max-width: 360px) {
  #btns { grid-template-columns: repeat(2, 56px); }
  .act { width: 56px; height: 56px; }
}
  /* 默认加载界面（铺陈画卷 → 开始界面）。HTML 直出、无需等 JS，杜绝首屏空白；
     背景与 body 一致（宣纸渐变），过渡淡出后露出画布上的开始界面。 */
  #loader {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(140px 140px at 18% 12%, rgba(120,100,70,0.05), transparent 60%),
      radial-gradient(180px 180px at 82% 30%, rgba(120,100,70,0.04), transparent 60%),
      radial-gradient(160px 160px at 30% 88%, rgba(120,100,70,0.05), transparent 60%),
      linear-gradient(160deg, #f3ead9 0%, #ece0c8 55%, #e4d6ba 100%);
    color: #3a3027;
    transition: opacity .55s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader.hidden { display: none; }
  .loader-title { font-family: "STKaiti","KaiTi","Songti SC",serif; font-size: 30px; letter-spacing: 8px; color: #c2453d; }
  .loader-spin {
    margin-top: 22px; width: 26px; height: 26px;
    border: 3px solid rgba(194,69,61,0.22); border-top-color: #c2453d;
    border-radius: 50%; animation: ylt-spin .9s linear infinite;
  }
  @keyframes ylt-spin { to { transform: rotate(360deg); } }
  .loader-tip { margin-top: 12px; font-size: 12px; letter-spacing: 1px; color: #8a7a66; }
  .loader-prog { margin-top: 18px; width: 160px; height: 3px; border-radius: 3px;
    background: rgba(58,48,39,.16); overflow: hidden; }
  .loader-prog > i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #c2453d, #e8c06a);   /* 朱砂 → 暖金 */
    border-radius: 3px; transition: width .25s linear; }
  .loader-pct { margin-top: 6px; font-size: 10px; letter-spacing: 1px; color: #a8977f; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-title">明清日常</div>
    <div class="loader-spin"></div>
    <div class="loader-tip" id="loaderTip">正在铺陈画卷…</div>
    <div class="loader-prog"><i id="loaderProg"></i></div>
    <div class="loader-pct" id="loaderPct">0%</div>
  </div>
  <script>
  // 加载界面提示文案：多条随机轮换，每 2 秒换一条（避免与上一条重复）；加载层隐藏后停止轮换。
  (function () {
    var tips = [
      "正在展开画卷……",
      "正在整理书架……",
      "正在誊抄医典……",
      "正在炼制丹药……",
      "正在对坐煮茶……",
      "正在外出采药……",
      "正在眺望远山……"
    ];
    var el = document.getElementById("loaderTip");
    if (el) {
      var i = -1, loader = document.getElementById("loader");
      setInterval(function () {
        if (loader && loader.classList.contains("hidden")) return;
        var j; do { j = Math.floor(Math.random() * tips.length); } while (tips.length > 1 && j === i);
        i = j; el.textContent = tips[j];
      }, 2000);
    }
  })();
  // 加载进度墨线：读取引擎写入的 window.__YLT_LOAD_PROGRESS（图片/书文分片计数 + 开始界面就绪 加权）
  (function () {
    var bar = document.getElementById("loaderProg");
    var pct = document.getElementById("loaderPct");
    var loader = document.getElementById("loader");
    var _bootStartT = (typeof performance !== "undefined" ? performance.now() : Date.now());
    function tick() {
      if (!bar) return;
      // 真实进度：引擎每帧写入 window.__YLT_LOAD_PROGRESS（bundles→分片→解码→开始界面就绪 加权）。
      // 非伪造：仅当 bundle 尚未解析完成时显固定 4%（页面已起、正在拉取脚本），避免「纯 0 像卡死」；bundles 就绪后完全由真实计数驱动。
      var p = (typeof window !== "undefined" && window.__YLT_LOAD_PROGRESS) || 0;
      if (!window.__YLT_BUNDLES_DONE && p < 0.04) p = 0.04;
      if (p < 0) p = 0; if (p > 1) p = 1;
      bar.style.width = (p * 100).toFixed(0) + "%";
      if (pct) pct.textContent = (p * 100).toFixed(0) + "%";
    }
    var iv = setInterval(function () {
      if (loader && loader.classList.contains("hidden")) { clearInterval(iv); return; }
      tick();
    }, 120);
    tick();
  })();
  </script>
  <div id="stage">
    <div id="frame">
      <canvas id="game"></canvas>
    </div>
    <div id="controls">
      <div id="btns">
        <button id="bAtk" class="act"><span class="ico">剑</span><span>攻击</span></button>
        <button id="bHeal" class="act"><span class="ico">疗</span><span>疗伤</span></button>
        <button id="bSw" class="act"><span class="ico">换</span><span>切换</span></button>
        <button id="bCombo" class="act combo"><span class="ico">同</span><span>合击</span></button>
      </div>
    </div>
    <div id="decl">
      <div class="by">鸿影 作品</div>
      <div>个人练习所作，仅用于同好内部交流。</div>
      <div>OOC预警！【CP向】同人作品，私设如山。</div>
    </div>
  </div>

  <!-- 配置 + 引擎（build_bundle.py 生成，O4 合并为单包 core_bundle.js）：
       core_bundle.js     = 首屏必需「配置 + 家园核心引擎」合并单包（阻塞加载、启动即解析；减 1 个请求）
       config_lazy_bundle = 书籍相关配置，由 main.js 的 ensureConfigLazy 在标题界面显示后后台注入（不阻塞首屏）
       src_lazy_bundle    = 进家园后才用（由 ensureLazy 后台拉取）
       图片地图 config/05_imgmap.js 独立阻塞注入（不进 bundle，便于发布期 XOR 翻转 x 标记）。
       <head> 内 PRELOAD_CRIT 标记块由 _publish.content_hash 注入关键图 preload（as=fetch crossorigin）。
       源文件 config/*.js、src/*.js 仍保留供编辑与无头测试。 -->
  <script src="config/05_imgmap.0896726c22.js"></script>
  <script src="core_bundle.a015c58258.js"></script>
  <script>window.__YLT_BUNDLES_DONE = true; window.__LAZY_SRC = "src_lazy_bundle.0dc0d1ccb9.js"; window.__CONFIG_LAZY_SRC = "config_lazy_bundle.638cb55437.js";</script>
  <!-- 图片二进制化（O2 变体B）：图片地图 config/05_imgmap.js 由 config_core 在启动时阻塞注入 window.YLT_IMG_FILES（rawPath→{u:.webp, x}），
       所有精灵在 loadAllImages() 立即登记并 fetch→blob→(XOR)→decode（见 core.js fetchDrawable），无「分片未到」窗口。
       二进制 .webp 由 image/ 与 npc/ 目录提供；发布副本由 _publish.encrypt_image_files 做 XOR 密文（x:true）保护。
       书籍正文分片(config/16_booktext/<id>_N.js) 仍由 ensureBook 按需懒加载。 -->
</body>
